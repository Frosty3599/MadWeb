# Publishes the storefront to GitHub Pages on every push to main.
#
# The `enablement: true` below is what actually switches Pages on for this
# repository, using the workflow's own pages:write permission — there is no
# separate setting to flip by hand first.
#
# Note this deploys the static site only. api/create-checkout-session.js needs a
# server, so checkout stays in demonstration mode here; a real payment flow needs
# Vercel or another host that runs serverless functions.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it midway — a half-applied
# deploy is worse than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
